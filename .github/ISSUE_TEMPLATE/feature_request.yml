name: Feature request
description: Something an agent should be able to do with Factuarea and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the task from the user's point of view, not the tool you imagine.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
      description: Which tools you tried, and where the agent gets stuck.
  - type: textarea
    id: context
    attributes:
      label: Anything else?

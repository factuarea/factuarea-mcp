name: Release

# Release pipeline for @factuarea/mcp and its MCP Registry entry.
#
# Flow (Changesets + npm Trusted Publishing + MCP Registry):
#   1. Pull requests that change the package carry a changeset (.changeset/*.md).
#   2. On merge to main, changesets/action opens or updates the "Version Packages"
#      pull request: it applies the bumps, rewrites CHANGELOG.md and package.json,
#      and keeps server.json on the same version (`npm run version`).
#   3. Merging THAT pull request leaves no changesets pending, so this workflow
#      publishes to npm through OIDC Trusted Publishing — no long-lived NPM_TOKEN —
#      with build provenance, and then announces the version to the MCP Registry
#      as com.factuarea/mcp, authenticated by the DNS record on factuarea.com.
#
# One-time setup (npm Trusted Publisher, DNS key, MCP_REGISTRY_PRIVATE_KEY secret)
# is described in CONTRIBUTING.md → Releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the Version Packages branch and create tags and releases
  pull-requests: write # open and update the Version Packages pull request
  id-token: write # OIDC token for npm Trusted Publishing and provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # changesets needs the history for changelog links

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; setup-node ships an older one.
      - name: Use an npm that supports Trusted Publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # Publish only what passes: a green CI run on an earlier commit says nothing
      # about the commit being released.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:package
      - run: npm run smoke

      - uses: ./.github/actions/setup-mcp-publisher
      - name: Validate the registry manifest before anything is published
        run: mcp-publisher validate

      - name: Create the Version Packages pull request, or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: npm run version
          publish: npm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: `npm publish` authenticates through OIDC when the package
          # has a Trusted Publisher configured on npmjs.com.
          NPM_CONFIG_PROVENANCE: 'true'

      # A release can reach npm and still miss the registry: npm can take minutes to
      # serve a version it has just accepted, and the registry rejects a version it
      # cannot read there. So the announcement does not depend only on this run's
      # publish: every run checks the version of the commit it runs on and announces
      # it when npm has it and the registry does not. A missed announcement is then
      # completed by the next push to main or by running this workflow by hand.
      - name: Check the version against the MCP Registry
        id: registry
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
        run: |
          # In version mode changesets/action leaves the checkout on the Version
          # Packages branch, whose version is not on npm yet: go back to this commit.
          git checkout --quiet --detach "$GITHUB_SHA"
          version=$(node -p "require('./server.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          registry=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/com.factuarea%2Fmcp/versions/$version")
          npm=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@factuarea%2Fmcp/$version")
          echo "com.factuarea/mcp $version: MCP Registry $registry, npm $npm."
          if [ "$PUBLISHED" = true ] || { [ "$registry" = 404 ] && [ "$npm" = 200 ]; }; then
            echo "announce=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce the release to the MCP Registry
        if: steps.registry.outputs.announce == 'true'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
          VERSION: ${{ steps.registry.outputs.version }}
        run: |
          # The registry checks the `mcpName` of the npm version it is told about, so
          # wait until npm serves that version, up to 15 minutes.
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@factuarea%2Fmcp/$VERSION")
            if [ "$status" = 200 ]; then break; fi
            if [ "$attempt" = 30 ]; then
              echo "::error::npm does not serve @factuarea/mcp@$VERSION after 15 minutes."
              exit 1
            fi
            sleep 30
          done
          mcp-publisher login dns --domain factuarea.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          for attempt in 1 2 3 4 5; do
            if mcp-publisher publish; then exit 0; fi
            echo "Registry publish failed (attempt $attempt); retrying…"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Explain a failed release
        if: failure()
        run: |
          echo "::error::The release failed. If npm rejected the publish, the npm Trusted Publisher"
          echo "::error::for @factuarea/mcp is missing (owner factuarea, repo factuarea-mcp, workflow release.yml)."
          echo "::error::If only the registry step failed, npm already has the version: fix the DNS key or the"
          echo "::error::MCP_REGISTRY_PRIVATE_KEY secret if needed and run this workflow again. See CONTRIBUTING.md."

name: Set up mcp-publisher
description: Installs a pinned, checksum-verified mcp-publisher, the MCP Registry's CLI.

inputs:
  version:
    description: mcp-publisher release to install.
    default: '1.8.1'
  sha256:
    description: SHA-256 of mcp-publisher_linux_amd64.tar.gz for that release, from its checksums file.
    default: 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'

runs:
  using: composite
  steps:
    # Pinned and verified rather than `latest`: this binary signs our registry
    # entry, so an unreviewed upstream release must not change what it does.
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
          "https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/mcp-publisher_linux_amd64.tar.gz"
        echo "${SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
        sudo install "$RUNNER_TEMP/mcp-publisher" /usr/local/bin/mcp-publisher
        mcp-publisher --help > /dev/null
